services:
  api:
    build: .
    image: molu-api:latest
    container_name: molu-api
    restart: unless-stopped
    # Loopback-only — public edge is Cloudflare Tunnel.
    ports:
      - "127.0.0.1:${HOST_PORT:-8000}:8000"
    environment:
      GEMINI_API_KEY: ${GEMINI_API_KEY:?GEMINI_API_KEY must be set in .env}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-2.5-pro}
      CORS_ORIGINS: ${CORS_ORIGINS:-https://molu.likelionscnu.site,http://localhost:3000,http://localhost:3300}
      MAX_IMAGE_MB: ${MAX_IMAGE_MB:-10}
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://127.0.0.1:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
