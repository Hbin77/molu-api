services:
  api:
    build: .
    image: molu-api:latest
    container_name: molu-api
    restart: unless-stopped
    # No host port published. The API is reached only by other containers
    # on the shared `molu-net` network (the molu-mvp web service proxies it).
    # Cloudflare Tunnel is NOT configured for this service.
    expose:
      - "8000"
    environment:
      GEMINI_API_KEY: ${GEMINI_API_KEY:?GEMINI_API_KEY must be set in .env}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-2.5-pro}
      # CORS irrelevant when only the Next.js server-side proxy calls us,
      # but kept permissive for local dev / curl from the host.
      CORS_ORIGINS: ${CORS_ORIGINS:-https://molu.likelionscnu.site,http://localhost:3000,http://localhost:3300}
      MAX_IMAGE_MB: ${MAX_IMAGE_MB:-10}
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://127.0.0.1:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - molu-net

networks:
  molu-net:
    external: true
    name: molu-net
